 -webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
header h1{margin:0;flex:1;text-align:center;color:#fff;text-shadow:0 1px 6px rgba(80,40,140,.55);font-size:24px;font-weight:800;line-height:1.05;overflow:hidden}
header h1 .mo{font-size:40px;letter-spacing:-1px;margin:0 2px;text-shadow:0 2px 10px rgba(80,40,140,.6)}
header h1 small{font-size:15px;opacity:.9;margin-right:4px}
header h1 .en{display:block;font-family:"Dancing Script",cursive;font-size:17px;font-weight:600;opacity:.95;text-shadow:0 1px 6px rgba(80,40,140,.6)}
header h1 .ttl-in{display:inline-block}
header h1 .ttl-in.go-l{animation:ttlL .45s var(--spring)}header h1 .ttl-in.go-r{animation:ttlR .45s var(--spring)}
@keyframes ttlL{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes ttlR{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.arrow{background:rgba(255,255,255,.78);border:0;color:#6b49b0;font-size:20px;font-weight:800;width:38px;height:38px;border-radius:50%;flex:0 0 38px}
.gear{position:absolute;right:8px;top:-3px;background:#f3ecff;border:0;width:28px;height:28px;border-radius:50%;font-size:15px;line-height:28px;padding:0;z-index:2}
.gear.spin{animation:spin 1.2s linear infinite}
.sync{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;font-size:11px;background:rgba(255,255,255,.75);border-radius:10px;padding:2px 8px;opacity:0;transition:opacity .3s;color:#6b49b0;font-weight:700}
.sync.on{opacity:1}
.sync.on::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;border:2px solid #b38be8;border-top-color:transparent;margin-right:5px;vertical-align:-1px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.legend{display:flex;justify-content:center;gap:14px;font-size:12px;font-weight:700;padding:2px 16px 3px;position:relative;z-index:1}
.legend span{display:flex;align-items:center;gap:4px}
.dot{width:13px;height:13px;border-radius:50%;display:inline-block}
.dot.p{background:var(--p)}.dot.m{background:var(--m)}
.cml::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);font-size:13px;font-weight:700;text-align:center;padding:0 6px 3px;color:#7a6a99}
.week div:first-child{color:var(--red)}.week div:last-child{color:var(--blue)}
/* month grid */
.gridwrap{flex:1;position:relative;overflow:hidden;min-height:0;touch-action:pan-y}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;padding:0 6px;will-change:transform}
.grid.slide{transition:transform .32s var(--ease)}
.day{border-top:1px solid var(--line);padding:2px 1px;overflow:hidden;cursor:pointer;position:relative;transition:background .2s}
.day:active{background:rgba(155,111,214,.12)}
.day .n{font-size:12.5px;font-weight:800;display:inline-block;width:19px;height:19px;line-height:19px;text-align:center}
.day .rk{float:right;font-size:8px;line-height:1;margin:5px 1px 0 0;opacity:.55;letter-spacing:-.5px;font-weight:500}
.day .rk.dai{color:var(--red);opacity:.95;font-weight:800}
.day .rk.butsu{opacity:.4}
.day .hol{font-size:8px;height:10px;color:var(--red);font-weight:700;white-space:nowrap;overflow:hidden;line-height:1.2;margin:-1px 0 1px 1px}
.day.out{opacity:.28;background:rgba(200,190,215,.18)}
.day.out .chip{filter:grayscale(.5)}
.day.sun .n,.day.hd .n{color:var(--red)}.day.sat .n{color:var(--blue)}
.day.today{background:linear-gradient(180deg,rgba(179,139,232,.28),rgba(179,139,232,.1));border-radius:12px;box-shadow:inset 0 0 0 2px #9b6fd6;z-index:1}
.day.today .n{color:#fff;background:linear-gradient(135deg,#b38be8,#7f5bc9);border-radius:50%;box-shadow:0 2px 8px rgba(127,91,201,.45);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(155,111,214,.55)}50%{box-shadow:0 0 0 6px rgba(155,111,214,0)}}
.day .tdy{position:absolute;top:1px;right:2px;font-size:8.5px;font-weight:800;color:#fff;background:#9b6fd6;border-radius:6px;padding:0 3px;line-height:13px}
.day.today .rk{display:none}
.day.sel{background:rgba(155,111,214,.13);border-radius:10px}
.chip{font-size:9px;font-weight:700;height:12px;line-height:12px;padding:0 2px;margin:0 0 1px;border-radius:4px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;color:var(--ink);-webkit-touch-callout:none}
.chip.lifted{opacity:.3}
.chip.ghost{position:fixed;z-index:60;pointer-events:none;transform:scale(1.15) rotate(-3deg);box-shadow:0 8px 20px rgba(80,40,140,.35);font-size:12px;height:20px;line-height:20px;padding:0 8px;transition:none}
.grid.dragging .day.drop{background:rgba(155,111,214,.25);border-radius:10px;box-shadow:inset 0 0 0 2px #9b6fd6}
.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:230px;font-weight:800;color:rgba(155,111,214,.09);pointer-events:none;letter-spacing:-8px;line-height:1}
.backnow{position:absolute;left:10px;top:1px;border:0;background:#9b6fd6;color:#fff;font-size:12px;font-weight:800;border-radius:12px;padding:3px 10px;transform:scale(0);transition:transform .35s var(--spring);z-index:2}
.backnow.on{transform:scale(1)}
.toast.act{pointer-events:auto}
.toast .undo{border:0;background:#fff;color:#6b49b0;border-radius:10px;padding:3px 10px;margin-left:8px;font-weight:800}
.chip.p{background:var(--p-bg)}.chip.m{background:var(--m-bg)}
.chip.self{background:transparent;box-shadow:inset 0 0 0 1.2px currentColor}
.chip.self.p{color:#3d6fa6}.chip.self.m{color:#7b52b8}
.chip.c::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-left:3px;vertical-align:middle}
.more{font-size:9px;font-weight:800;color:#7a5cc0;padding-left:2px;line-height:11px}
.grid.anim .chip{animation:pop .5s var(--spring) backwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.chip.new{animation:popBig .7s var(--spring)}
@keyframes popBig{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.25)}100%{transform:none;opacity:1}}
/* nav */
nav{display:flex;background:#fff;border-top:1.5px solid var(--line);padding:4px 0 calc(2px + env(safe-area-inset-bottom));position:relative;z-index:6}
nav button{flex:1;background:none;border:0;font-size:12px;font-weight:800;opacity:.55;position:relative;transition:opacity .2s,transform .15s}
nav button img{display:block;width:34px;height:34px;margin:0 auto 1px;object-fit:contain;transition:transform .35s var(--spring)}
nav button.on{opacity:1}
nav button.on img{transform:scale(1.12) translateY(-2px)}
nav button::after{content:"";display:block;width:0;height:3px;border-radius:2px;background:var(--accent);margin:3px auto 0;transition:width .35s var(--spring)}
nav button.on::after{width:22px}
nav .badge{position:absolute;top:0;left:58%;background:#e2557a;color:#fff;border-radius:9px;font-size:11px;padding:0 6px;transform:scale(0);transition:transform .35s var(--spring)}
nav .badge.on{transform:scale(1)}
.fab{position:absolute;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:3px solid #fff;
 background:linear-gradient(135deg,#c19af0,#8a63d2);font-size:34px;line-height:1;color:#fff;box-shadow:0 6px 16px rgba(130,90,200,.45);z-index:5;transition:transform .4s var(--spring),opacity .2s}
.fab:active{transform:scale(.9) rotate(90deg)}
.fab.hide{transform:scale(0);opacity:0;pointer-events:none}
/* sheets */
.shade{position:absolute;inset:0;background:rgba(50,30,80,.3);opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
.shade.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(120,80,190,.18);
 padding:10px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .5s var(--spring);z-index:10;max-height:88%;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet.open{transform:none}
.sheet.drag{transition:none}
.grab{width:46px;height:5px;background:var(--line);border-radius:3px;margin:0 auto 10px}
.sheet h2{margin:2px 0 10px;font-size:20px;font-weight:800}
.rk-t{font-size:13px;opacity:.65;margin-left:6px;font-weight:500}
.hol-t{font-size:13px;color:var(--red);margin-left:6px}
.ev{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin:8px 0;border-radius:16px;cursor:pointer;animation:rise .45s var(--spring) backwards}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.ev.p{background:var(--p-soft)}.ev.m{background:var(--m-soft)}
.ev.self{background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.ev .t{font-size:13px;font-weight:800;min-width:46px;opacity:.85;padding-top:2px}
.ev .who{font-size:11px;opacity:.7}
.ev .ttl{font-size:17px;font-weight:800;word-break:break-all}
.ev .cm{font-size:12px;opacity:.75;margin-top:2px}
.empty{opacity:.6;text-align:center;padding:16px 0}
.detail-top{padding:14px;border-radius:18px;margin-bottom:10px}
.detail-top.p{background:var(--p-soft)}.detail-top.m{background:var(--m-soft)}
.detail-top .ttl{font-size:22px;font-weight:800;word-break:break-all;margin:2px 0 6px}
.row{font-size:14px;margin:4px 0;word-break:break-all;-webkit-user-select:text;user-select:text}
.row.memo{white-space:pre-wrap;background:rgba(255,255,255,.6);border-radius:10px;padding:6px 8px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:#fff;margin-left:4px;vertical-align:2px}
.acts{display:flex;gap:8px;margin:6px 0 4px}
.acts button{flex:1;border:0;border-radius:14px;padding:9px;background:#f3ecff;font-weight:700}
.acts .del{background:#fde8ee;color:#c0395e}
.sec{border-top:1.5px dashed var(--line);padding:10px 0 8px}
.sec b{font-size:15px}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.ph-grid .ph,.ph-add{width:100%;aspect-ratio:1;border-radius:12px;display:block;overflow:hidden;background:#f3ecff}
.ph-grid .ph img{width:100%;height:100%;object-fit:cover;display:block;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0}}
.ph-add{border:2px dashed var(--line);background:transparent;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#7a5cc0}
.ph-add b{font-size:22px}
.ph-grid .ph.up{position:relative}
.ph-grid .ph.up::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shim 1s infinite}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.bubble{display:flex;gap:8px;margin:8px 0;align-items:flex-end;animation:rise .4s var(--spring) backwards}
.bubble.me{flex-direction:row-reverse}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex:0 0 32px}
.av.p{background:var(--p-bg)}.av.m{background:var(--m-bg)}
.bubble p{margin:0;padding:8px 11px;border-radius:16px 16px 16px 4px;background:#f5effc;font-size:15px;max-width:74%;white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text}
.bubble.me p{border-radius:16px 16px 4px 16px;background:#efe5fb}
.bubble small{display:block;font-size:10px;opacity:.55;margin-top:2px}
.say{display:flex;gap:6px;margin-top:8px}
.say textarea{flex:1;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:18px;resize:none;height:44px;max-height:120px}
.btn{border:0;background:linear-gradient(135deg,#b38be8,#7f5bc9);color:#fff;border-radius:16px;padding:10px 16px;font-weight:800;box-shadow:0 3px 10px rgba(127,91,201,.3)}
.btn.wide{width:100%;padding:14px;font-size:17px}
.btn.ghost{background:#f3ecff;color:var(--ink);box-shadow:none}
.btn:disabled{filter:grayscale(.6) opacity(.6)}
label{display:block;font-size:13px;margin:12px 0 4px;opacity:.75;font-weight:700}
.f{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
textarea.f{min-height:70px;resize:vertical}
.two{display:flex;gap:8px}.two>*{flex:1;min-width:0}
.seg{display:flex;background:#f3ecff;border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:8px 4px;font-size:13px;font-weight:700;transition:background .25s,box-shadow .25s,transform .15s}
.seg button.on{background:#fff;box-shadow:0 2px 6px rgba(120,80,190,.2)}
.toggle{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:700}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
/* pages */
.page{position:absolute;inset:0 0 calc(64px + env(safe-area-inset-bottom)) 0;background:var(--paper);padding:calc(16px + env(safe-area-inset-top)) 16px 16px;overflow:auto;display:none;z-index:4}
.page.on{display:block;animation:pageIn .4s var(--spring)}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}}
.page h2{margin:4px 0 10px;font-weight:800}
.note{display:flex;gap:10px;padding:11px;margin:8px 0;background:#fff;border:1.5px solid var(--line);border-radius:16px;cursor:pointer;animation:rise .45s var(--spring) backwards}
.note.new{border-color:#c6a9ee;background:#fbf7ff}
.note .tx{font-size:13px;line-height:1.5;min-width:0;word-break:break-all}
.note b{font-size:14px}
.note small{display:block;opacity:.55;font-size:11px}
/* settings */
.cal-row{padding:10px 0;border-bottom:1px solid var(--line)}
.cal-row .nm{font-weight:800;font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.cal-row .nm i{width:10px;height:10px;border-radius:3px;display:inline-block}
.warn{font-size:12px;color:#c0395e;margin-top:4px}
.hint{font-size:12px;opacity:.7;line-height:1.6}
/* login */
.login{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;background:linear-gradient(180deg,#efe5ff,#fff 60%)}
.login.on{display:flex}
.login img{width:120px;height:120px;border-radius:28px;box-shadow:0 10px 30px rgba(127,91,201,.35);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.login h1{font-size:28px;margin:22px 0 6px;font-weight:800}
.login p{font-size:14px;line-height:1.7;opacity:.8;margin:6px 0}
.login .btn{margin-top:22px;font-size:18px;padding:14px 26px}
.login .small{font-size:12px;opacity:.65;margin-top:18px;line-height:1.7}
.who-pick{display:flex;gap:10px;margin-top:8px}
.who-pick button{flex:1;padding:16px 8px;border:2px solid var(--line);border-radius:18px;background:#fff;font-size:18px;font-weight:800;transition:transform .3s var(--spring),border-color .2s,background .2s}
.who-pick button.on.p{background:var(--p-soft);border-color:var(--p)}
.who-pick button.on.m{background:var(--m-soft);border-color:var(--m)}
.who-pick button.on{transform:scale(1.04)}
/* viewer, toast, hearts */
.viewer{position:absolute;inset:0;background:rgba(20,10,35,.92);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .25s}
.viewer.on{opacity:1;pointer-events:auto}
.viewer img{max-width:96%;max-height:76%;border-radius:10px;transform:scale(.85);transition:transform .45s var(--spring)}
.viewer.on img{transform:none}
.viewer .vbar{display:flex;gap:12px}
.viewer button{font-size:14px;border:0;border-radius:18px;padding:9px 16px;background:#fff;color:#333}
.viewer button.del{background:#e2557a;color:#fff}
.toast{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(58,42,88,.92);color:#fff;padding:10px 16px;border-radius:18px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s,transform .4s var(--spring);max-width:86%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.heart{position:fixed;pointer-events:none;z-index:50;font-size:18px;animation:burst .9s var(--ease) forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(var(--r));opacity:0}}
.a2hs{position:absolute;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));background:#fff;border-radius:16px;box-shadow:0 6px 20px rgba(120,80,190,.25);padding:10px 12px;font-size:13px;z-index:7;display:none;line-height:1.6}
.a2hs.on{display:block;animation:rise .5s var(--spring)}
.a2hs button{float:right;border:0;background:#f3ecff;border-radius:10px;padding:2px 10px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  $("tabCal").classList.toggle("on", n === 0); $("tabNote").classList.toggle("on", n === 1);
  $("notice").classList.toggle("on", n === 1); $("fab").classList.toggle("hide", n === 1); closeAll();
  if (n === 1) { drawFeed(); loadFeed().then(() => { const t = Date.now(); LS.set("seen", t); const mm = members.find((x) => x.email === me); if (mm) mm.seen = t; api("/api/seen", { method: "POST", json: { at: t } }).catch(() => {}); setTimeout(drawFeed, 1500); }); }
}
function goToday() { tab(0); today = new Date(); const m = new Date(today.getFullYear(), today.getMonth(), 1);
  if (ym(m) !== ym(cur)) show(m, m > cur ? 1 : -1).then(() => openDay(today)); else openDay(today); }

/* ---------- 設定 ---------- */
let draftVis = {};
function openSettings() {
  draftVis = {};
  const own = calList.filter((c) => c.accessRole === "owner" && !/#holiday@/.test(c.id));
  const pEmail = partner?.email;
  const others = calList.filter((c) => c.accessRole !== "owner" && !/#holiday@/.test(c.id) && !(pEmail && visOf(pEmail, c.id)));
  const theirs = calList.filter((c) => c.accessRole !== "owner" && pEmail && visOf(pEmail, c.id) === "both");
  const pSees = (id) => !pEmail ? null : calsRows.some((r) => r.email === pEmail && r.cal_id === id);
  for (const c of own) draftVis[c.id] = visOf(me, c.id) || "me";
  for (const c of others) draftVis[c.id] = visOf(me, c.id) || "xme";
  const seg = (c, opts) => `<div class="seg" data-id="${esc(c.id)}">${opts.map(([v, t]) => `<button class="${draftVis[c.id] === v ? "on" : ""}" onclick="setVis(this,'${v}')">${t}</button>`).join("")}</div>`;
  $("setBody").innerHTML = `<h2>⚙️ 設定</h2>
   <label>あなたは</label><div class="who-pick" id="setWho"><button class="p ${myRole === "p" ? "on" : ""}" onclick="pickRole(this,'p')">🔵 とと</button><button class="m ${myRole === "m" ? "on" : ""}" onclick="pickRole(this,'m')">🌸 かか</button></div>
   <label>表示する名前</label><input class="f" id="setName" value="${esc(roleName(myRole))}" maxlength="10">
   <label style="margin-top:18px">予定の色（この端末）</label><div class="seg"><button class="${colorMode === "google" ? "on" : ""}" onclick="setColorMode(this,'google')">Googleカレンダーの色</button><button class="${colorMode !== "google" ? "on" : ""}" onclick="setColorMode(this,'two')">ふたりの色（青・紫）</button></div>
   <p class="hint">Googleカレンダーの色のときは、予定の左はしの線で 🔵${esc(roleName("p"))}／🌸${esc(roleName("m"))} がわかります。</p>
   <label style="margin-top:18px">自分のカレンダー</label><p class="hint">「ふたりに」…相手のアプリにも出ます／「自分だけ」…自分のアプリだけに出ます</p>
   ${own.map((c) => `<div class="cal-row"><div class="nm"><i style="background:${esc(c.backgroundColor || "#ccc")}"></i>${esc(c.summaryOverride || c.summary)}</div>${seg(c, [["both", "ふたりに"], ["me", "自分だけ"], ["hide", "表示しない"]])}
     ${draftVis[c.id] === "both" && pSees(c.id) === false ? `<div class="warn">⚠️ 相手のアプリではまだ見えていません。Googleカレンダーで相手と共有してください。</div>` : ""}</div>`).join("") || `<p class="hint">ありません</p>`}
   ${others.length ? `<label style="margin-top:18px">ほかのカレンダー（自分だけに出ます）</label>${others.map((c) => `<div class="cal-row"><div class="nm"><i style="background:${esc(c.backgroundColor || "#ccc")}"></i>${esc(c.summaryOverride || c.summary)}</div>${seg(c, [["xme", "表示する"], ["xhide", "表示しない"]])}</div>`).join("")}` : ""}
   ${theirs.length ? `<label style="margin-top:18px">${esc(roleName(myRole === "p" ? "m" : "p"))}のカレンダー（相手が「ふたりに」にしたもの）</label>${theirs.map((c) => `<div class="cal-row"><div class="nm"><i style="background:${esc(c.backgroundColor || "#ccc")}"></i>${esc(c.summaryOverride || c.summary)}</div></div>`).join("")}` : ""}
   <p style="margin:18px 0 0"><button class="btn wide" id="setSave" onclick="saveSettings()">保存する</button></p>
   <label style="margin-top:22px">🔔 iPhoneへの通知</label><div id="pushBox"><p class="hint">確認中…</p></div>
   <p style="text-align:center;margin:20px 0 4px"><button class="btn ghost" onclick="logout()">この端末からログアウト</button></p>
   <p class="hint" style="text-align:center">${esc(me || "")}<br>ふたりカレンダー v1.3.1</p>`;
  openSheet("setSheet"); drawPush();
}
/* ---------- 通知 ---------- */
const pushOK = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const b64uToU8 = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), (c) => c.charCodeAt(0));
async function drawPush() {
  const box = $("pushBox"); if (!box) return;
  const mm = members.find((x) => x.email === me) || {}; let pref = {}; try { pref = JSON.parse(mm.notify || "{}"); } catch {}
  const prefHtml = `<div class="hint" style="margin-top:8px">通知する内容</div>${[["comment", "💬 コメント"], ["photo", "📷 写真"], ["event", "📅 予定の追加・変更・削除"]].map(([k, t]) =>
    `<label class="toggle" style="margin-top:6px"><input type="checkbox" ${pref[k] === false ? "" : "checked"} onchange="setPref('${k}', this.checked)"> ${t}</label>`).join("")}`;
  if (!pushOK()) { box.innerHTML = /iPhone|iPad/.test(navigator.userAgent) && !navigator.standalone
      ? `<p class="hint">通知は、<b>ホーム画面のアイコンから開いたとき</b>だけ使えます。Safariの共有ボタン→「ホーム画面に追加」をしてから、アイコンで開いてください。</p>`
      : `<p class="hint">この端末・ブラウザでは通知が使えません（iPhoneは iOS 16.4 以降が必要です）。</p>`; return; }
  const reg = await Promise.race([navigator.serviceWorker.ready, new Promise((r) => setTimeout(r, 6000))]);
  if (!reg) { box.innerHTML = `<p class="hint">通知の準備ができませんでした。アプリを開き直してください。</p>`; return; }
  const sub = await reg.pushManager.getSubscription();
  if (Notification.permission === "denied") { box.innerHTML = `<p class="hint">通知が「許可しない」になっています。iPhoneの<b>設定 → 通知 → ふたりカレンダー</b>で「通知を許可」をオンにしてください。</p>` + prefHtml; return; }
  box.innerHTML = sub
    ? `<p style="margin:4px 0 8px;font-weight:800;color:#2e8b57">✓ この端末で通知を受け取っています</p><div class="acts"><button onclick="testPush(this)">ためしに通知を送る</button><button class="del" onclick="pushOff()">この端末はやめる</button></div>` + prefHtml
    : `<p class="hint">相手が予定を入れたり、コメントや写真をつけたりすると、iPhoneが鳴ってお知らせします。アイコンにも数字が付きます。</p><button class="btn wide" onclick="pushOn(this)">🔔 この端末で通知を受け取る</button>` + prefHtml;
}
async function pushOn(b) {
  b.disabled = true;
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { toast("通知が許可されませんでした"); drawPush(); return; }
    const { key } = await api("/api/push/key"); if (!key) throw new Error("サーバーの準備ができていません");
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToU8(key) });
    await api("/api/push/sub", { method: "POST", json: sub.toJSON() });
    hearts(b, "🔔"); toast("通知をオンにしました 🔔"); drawPush();
  } catch (e) { toast("通知をオンにできませんでした（" + e.message + "）", 4000); b.disabled = false; }
}
async function pushOff() {
  const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
  if (sub) { try { await api("/api/push/unsub", { method: "POST", json: { endpoint: sub.endpoint } }); } catch {} await sub.unsubscribe(); }
  toast("この端末の通知をやめました"); drawPush();
}
async function testPush(b) { b.disabled = true;
  try { const r = await api("/api/push/test", { method: "POST" }); toast(r.sent?.some((x) => x >= 200 && x < 300) ? "送りました。数秒で届きます" : "送れませんでした（" + (r.sent || []).join(",") + "）", 4000); }
  catch (e) { toast("送れませんでした（" + e.message + "）"); } setTimeout(() => (b.disabled = false), 3000); }
async function setPref(k, v) {
  const mm = members.find((x) => x.email === me); let pref = {}; try { pref = JSON.parse(mm.notify || "{}"); } catch {}
  pref[k] = v; mm.notify = JSON.stringify(pref);
  try { await api("/api/notify", { method: "POST", json: pref }); } catch { toast("保存できませんでした"); }
}
// 通知を押して開いたとき
let pendingJump = null;
navigator.serviceWorker?.addEventListener("message", (e) => { if (e.data?.open) jump(e.data.open.d, e.data.open.k, "open"); });
(() => { const q = new URLSearchParams(location.search); if (q.get("d")) pendingJump = { d: q.get("d"), k: q.get("k") || "" }; })();

function setVis(b, v) { const s = b.parentNode; s.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); draftVis[s.dataset.id] = v; }
let pickedRole = null;
function pickRole(b, r) { b.parentNode.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); pickedRole = r; const n = $("setName") || $("firstName"); if (n && (!n.value || n.value === "とと" || n.value === "かか")) n.value = r === "p" ? "とと" : "かか"; }
async function saveSettings() {
  const b = $("setSave"); b.disabled = true; b.textContent = "保存中…";
  try {
    const role = pickedRole || myRole, name = $("setName").value.trim() || (role === "p" ? "とと" : "かか");
    if (role !== myRole || name !== roleName(myRole)) await api("/api/me", { method: "POST", json: { role, name } });
    await saveCalVis(draftVis);
    await boot(true); closeSheet("setSheet"); toast("保存しました"); hearts(b);
  } catch (e) { toast("保存できませんでした（" + e.message + "）"); b.disabled = false; b.textContent = "保存する"; }
}
async function saveCalVis(vis) {
  const list = calList.filter((c) => !/#holiday@/.test(c.id)).map((c) => ({ id: c.id, name: c.summaryOverride || c.summary,
    vis: vis[c.id] || visOf(me, c.id) || (c.accessRole === "owner" ? "me" : "xme") }));
  await api("/api/cals", { method: "POST", json: { list } });
}

/* ---------- はじめて ---------- */
function firstRun() {
  $("login").classList.add("on");
  $("loginBody").innerHTML = `<p style="margin-top:14px"><b>はじめに、あなたはどっち？</b></p>
   <div class="who-pick"><button class="p" onclick="pickRole(this,'p')">🔵 とと</button><button class="m" onclick="pickRole(this,'m')">🌸 かか</button></div>
   <label style="text-align:left">表示する名前（あとで変えられます）</label><input class="f" id="firstName" maxlength="10" placeholder="とと">
   <button class="btn" id="firstBtn" onclick="firstSave()">はじめる</button>`;
}
async function firstSave() {
  if (!pickedRole) return toast("とと か かか を選んでください");
  const b = $("firstBtn"); b.disabled = true;
  try { await api("/api/me", { method: "POST", json: { role: pickedRole, name: $("firstName").value.trim() || (pickedRole === "p" ? "とと" : "かか") } });
    await saveCalVis({}); $("login").classList.remove("on"); await boot(true); hearts(b); setTimeout(openSettings, 600);
    toast("ようこそ！まず、出すカレンダーを選んでください", 4000);
  } catch (e) { toast("保存できませんでした（" + e.message + "）"); b.disabled = false; }
}

/* ---------- 起動 ---------- */
async function boot(refresh) {
  busy(true);
  try {
    const [cl, bt] = await Promise.all([gapi("/users/me/calendarList?minAccessRole=reader&maxResults=250&fields=items(id,summary,summaryOverride,accessRole,backgroundColor,primary)"), api("/api/boot")]);
    calList = cl.items || []; LS.set("calList", calList);
    if (!Object.keys(evPal).length) await loadPalette();
    me = bt.me; members = bt.members; calsRows = bt.cals;
    const mine = members.find((x) => x.email === me);
    if (!mine) { firstRun(); return false; }
    myRole = mine.role; partner = members.find((x) => x.email !== me) || null;
    LS.set("boot", { me, members, calsRows });
    // 新しく増えたカレンダーを一覧に登録（相手のアプリが「見えている」か判断できるように）
    if (calList.some((c) => !/#holiday@/.test(c.id) && !visOf(me, c.id))) saveCalVis({}).then(() => api("/api/boot")).then((b) => { calsRows = b.cals; }).catch(() => {});
    computeShown();
    if (refresh) Object.keys(evCache).forEach((k) => delete evCache[k]);
    await show(cur);
    loadFeed();
    if (pendingJump) { const j = pendingJump; pendingJump = null; history.replaceState({ fc: 1 }, "", location.pathname); jump(j.d, j.k, "open"); }
    return true;
  } finally { busy(false); }
}
async function start() {
  if (!navigator.standalone && /iPhone|iPad/.test(navigator.userAgent) && !LS.get("a2hsOff", false)) $("a2hs").classList.add("on");
  if (!sess) { needLogin(); return; }
  const c = LS.get("boot", null);
  if (c) { me = c.me; members = c.members; calsRows = c.calsRows; const mine = members.find((x) => x.email === me); if (mine) { myRole = mine.role; partner = members.find((x) => x.email !== me) || null; computeShown(); render(true); } }
  try { await boot(); } catch (e) { if (String(e.message) !== "expired") toast("つながりませんでした（" + e.message + "）", 4000); }
}
function hideA2hs() { $("a2hs").classList.remove("on"); LS.set("a2hsOff", true); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && sess && myRole) {
  const now = new Date(); if (key(now) !== key(today)) { today = now; }
  loadMonth(cur, true).then(() => render()).catch(() => {}); loadFeed(); } });
setInterval(() => { if (document.visibilityState === "visible" && sess && myRole) loadFeed(); }, 60000);
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
// 画面のはしからスワイプしても前のページ（ログイン画面など）に戻らないようにする。代わりに開いている画面を閉じる
history.replaceState({ fc: 0 }, ""); history.pushState({ fc: 1 }, "");
addEventListener("popstate", () => { history.pushState({ fc: 1 }, "");
  if ($("viewer").classList.contains("on")) closeView(); else if (stack.length) closeTop(); else if ($("notice").classList.contains("on")) tab(0); });
start();
</script>
